for(const id in labEls){const c=MAP.countries.find(x=>x.id===id);if(Math.hypot(c.cx-840,c.cy-470)<190)labEls[id].style.opacity=0}
// ---------------- top: medallion + gauges + date

 .map(([k,l,v,d,fr_,col,tip,key],i)=>`<div class="g" data-tip="${l}|${tip}|${key}" data-act="${k==='gold'?'budget':k==='env'?'nations':''}" style="position:absolute;left:${236+i*152-64}px;top:18px;cursor:pointer">${gaugeSvg({r:52,v,d,f:fr_,col})}<div class="cap" style="text-align:center;margin-top:-8px">${l}</div></div>`).join('')+[0,1,2].map(i=>`<div style="position:absolute;left:${236+i*152+66}px;top:82px;width:22px;height:3px;background:var(--lo)"></div>`).join('')}

 $('#top').innerHTML=`<div class="abs" data-tip="France|Emperor Napoleon. Opens the nation card.|N" data-act="nations" style="left:38px;top:36px;cursor:pointer"><svg width="140" height="140" viewBox="0 0 140 140">${bezelSvg(70,70,66,60)}<defs><clipPath id="fcm"><circle cx="70" cy="70" r="52"/></clipPath></defs><g clip-path="url(#fcm)"><rect x="18" width="35" height="140" fill="#2F4E9E"/><rect x="53" width="35" height="140" fill="#F3EEE3"/><rect x="88" width="36" height="140" fill="#C8372D"/></g><circle cx="70" cy="70" r="52" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/></svg>
 <div class="cz" style="position:absolute;top:140px;left:-10px;width:160px;text-align:center;font:700 19px Cinzel;letter-spacing:.22em">France</div><div style="position:absolute;top:166px;left:-20px;width:180px;text-align:center;font:italic 16px Alegreya;color:var(--dim)">Emperor Napoleon</div></div>

function renderTuner(){const x0=640,w=640,y0=1020;$('#tuner').innerHTML=`<svg class="abs" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none"><g style="pointer-events:auto"><rect x="${x0-30}" y="${y0-44}" width="${w+60}" height="78" fill="rgba(14,12,9,.93)" stroke="#7F6A33"/><path d="${Array.from({length:81},(_,i)=>{const x=x0+w*i/80;return `M${x} ${y0}v${i%20===0?14:i%5===0?9:5}`}).join('')}" stroke="#C9A24B" stroke-width=".8"/>${GAME.lens.map((l,i)=>`<text data-lens="${i}" x="${x0+w*(i+.5)/4}" y="${y0-14}" text-anchor="middle" font-family="Cinzel" font-size="14" letter-spacing="2.5" fill="${i===S.lens?'#EFE6CF':'#8d826a'}" font-weight="${i===S.lens?700:500}" style="cursor:pointer">${l.toUpperCase()}</text>`).join('')}<g style="transition:transform .4s cubic-bezier(.3,1.4,.5,1);transform:translateX(${w*S.lens/4}px)"><path d="M${x0+w*.125} ${y0-4}l-6 -12h12z" fill="#D2603F"/><path d="M${x0+w*.125} ${y0-4}v20" stroke="#D2603F" stroke-width="1.6"/></g></g></svg>`;
 $$('[data-lens]').forEach(t=>t.onclick=()=>{S.lens=+t.dataset.lens;renderTuner();recolor();toast('info','Map lens: '+GAME.lens[S.lens])})}
function recolor(){const L=S.lens;$$('path[data-id]',svg).forEach(p=>{const c=MAP.countries.find(x=>x.id===p.dataset.id);let col=c.id==='france'?'#2D4C78':PAL[c.c];if(L===1){const n=NAT.find(n=>nm(c).toLowerCase().includes(n.name.toLowerCase().split(' ')[0].toLowerCase()));col=c.id==='france'?'#2D4C78':n?relCol(n.rel)+'':'#2b2b2b';if(n)col=shade(col,.38)}if(L===2)col=c.id==='france'?'#6a3a1c':shade('#D2603F',.15+((c.c*37)%50)/100);if(L===3)col=['#3d4a2f','#4a4a3a','#3a3f3a','#52483a'][c.c%4];p.setAttribute('fill',col)})}
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);const r=(n>>16)*k,g=((n>>8)&255)*k,b=(n&255)*k;return `rgb(${r|0},${g|0},${b|0})`};
function renderMM(){const cx=150,cy=924,r=98;$('#mm').innerHTML=`<svg class="abs" style="left:0;top:0;width:400px;height:1080px;overflow:visible" data-tip="Minimap|Drag to move the view.|"><g class="btn">${bezelSvg(cx,cy,r,72)}<clipPath id="mmc"><circle cx="${cx}" cy="${cy}" r="${r-14}"/></clipPath><g clip-path="url(#mmc)"><rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="#090C11"/><g transform="translate(${cx-72} ${cy-42}) scale(.075)">${MAP.countries.map(c=>`<path d="${c.d}" fill="${c.id==='france'?'#C9A24B':PAL[c.c]}" opacity="${c.id==='france'?1:.8}"/>`).join('')}</g><rect x="${cx-24}" y="${cy-14}" width="48" height="28" fill="none" stroke="#EFE6CF" stroke-width="1.2"/><path d="M${cx-r+12} ${cy}h${2*r-24}M${cx} ${cy-r+12}v${2*r-24}" stroke="#C9A24B" stroke-width=".4" opacity=".6"/></g><text x="${cx}" y="${cy+r+26}" text-anchor="middle" class="cap" fill="#A89C80" font-family="Cinzel" font-size="11" letter-spacing="3.5">MINIMAP</text></g></svg>`}
function renderChrono(){const cx=1790,cy=930,r=108;$('#chrono').innerHTML=`<svg class="abs" id="chsvg" style="left:0;top:0;width:1920px;height:1080px;overflow:visible"><g data-tip="End turn|Ends turn ${S.turn}. Armies move, income is paid, rivals act.|Enter" style="cursor:pointer" id="chg">${bezelSvg(cx,cy,r,60)}<circle cx="${cx}" cy="${cy}" r="${r-14}" fill="url(#gFace)"/>${tickMarks(cx,cy,r-16,60,6,5,'#8a7338',.8)}<path d="${arcD(cx,cy,r-24,0,S.pending?300:220)}" stroke="#D2603F" stroke-width="4" fill="none" stroke-linecap="round"/>${[12,3,6,9].map((n,i)=>{const a=i*90,[x,y]=P(cx,cy,r-38,a);return `<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Cinzel" font-size="14" fill="#8a7338">${n}</text>`}).join('')}<text x="${cx}" y="${cy+18}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="54" fill="#EFE6CF">${S.turn}</text><text x="${cx}" y="${cy-26}" text-anchor="middle" font-family="Cinzel" font-size="11" letter-spacing="4" fill="#C9A24B">TURN</text><g id="hand" style="transform-origin:${cx}px ${cy}px;transition:transform 1.1s cubic-bezier(.4,0,.2,1)"><path d="M${cx} ${cy-r+16}l-8 -16h16z" fill="#D2603F" stroke="#0f0c09"/></g><text x="${cx}" y="${cy+r+30}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="16" letter-spacing="5" fill="#EFE6CF">END TURN</text></g></svg>`;

  NB.forEach(id=>{const p=paths[id];if(!p)return;p.setAttribute('stroke','#E5C77A');p.setAttribute('stroke-width',2.2);p.setAttribute('stroke-dasharray','8 5');p.style.cursor='pointer';p.style.filter='drop-shadow(0 0 6px rgba(229,199,122,.5))'});$$('path[data-id]',svg).forEach(p=>{if(!NB.includes(p.dataset.id)&&p.dataset.id!=='france')p.style.opacity=.45});renderTokens();return}

 let h=`<circle cx="${cx}" cy="${cy}" r="${r+24}" fill="rgba(6,8,12,.5)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#gBrass)" stroke-width="10"/><circle cx="${cx}" cy="${cy}" r="${r-5}" fill="none" stroke="#0f0c09" stroke-width="2"/>${tickMarks(cx,cy,r-6,72,6,6,'#C9A24B',.8)}<circle cx="${cx}" cy="${cy}" r="${r+8}" fill="none" stroke="#C9A24B" stroke-width=".6" stroke-dasharray="1 5" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="44" fill="rgba(15,12,9,.92)" stroke="#7F6A33"/><text x="${cx}" y="${cy+9}" text-anchor="middle" font-family="Alegreya" font-weight="700" font-size="32" fill="#EFE6CF">35</text><text x="${cx}" y="${cy-18}" text-anchor="middle" font-family="Cinzel" font-size="9" letter-spacing="3" fill="#C9A24B">ARMY</text>`;

 verbs.forEach(([deg,k,l,key])=>{const [x,y]=P(cx,cy,r,deg),[dx,dy,an]=lblpos[deg];g.insertAdjacentHTML('beforeend',`<text x="${x+dx}" y="${y+dy}" text-anchor="${an}" font-family="Cinzel" font-weight="700" font-size="13" letter-spacing="2.5" fill="#EFE6CF" paint-order="stroke" stroke="#05070a" stroke-width="4">${l.toUpperCase()}</text>`)});
 $$('.rv',g).forEach(v=>v.onclick=()=>verb(v.dataset.verb));
 if(!arm){const t=document.createElement('div');t.style.cssText=`position:absolute;left:${cx+r+215}px;top:${cy-100}px;width:292px`;t.innerHTML=plate(`<div style="padding:16px 18px 14px"><div class="cap" style="color:var(--brass)">PROVINCE</div><div class="cz" style="font:700 27px/1.05 Cinzel;letter-spacing:.05em;margin:5px 0 2px">${S.sel}</div><div style="font:italic 16px Alegreya;color:var(--dim)"><span style="color:#D2A05A">France</span> · your province</div><div style="display:flex;gap:6px;margin:12px 0 10px">${[['172','POP',0],['87%','STABILITY',.87],['57%','HAPPY',.57]].map(([v,l,f])=>`<div style="flex:1;border:1px solid #4a3f28;background:#100d0a;padding:6px 8px 5px;text-align:center"><b style="display:block;font:700 22px/1 Alegreya">${v}</b><small class="cap" style="font-size:9.5px">${l}</small>${f?`<i style="display:block;height:3px;background:#2a2318;margin-top:5px"><u style="display:block;height:3px;width:${f*100}%;background:${l==='HAPPY'?'#C9A24B':'#69B3A2'}"></u></i>`:''}</div>`).join('')}</div><a class="cz" data-act="dossier" style="display:flex;justify-content:space-between;font:600 13px Cinzel;letter-spacing:.18em;color:var(--brass);cursor:pointer;padding-top:6px;border-top:1px solid #3a3022">Dossier <span>›</span></a></div>`,'', '' ,8);$('#tagbox').appendChild(t);
  g.insertAdjacentHTML('beforeend',`<path d="M${cx+r+95} ${cy-10}H${cx+r+215}" stroke="#C9A24B" stroke-width="1.2"/><circle cx="${cx+r+95}" cy="${cy-10}" r="3" fill="#C9A24B"/>`)}

function goalsBody(){const G=[['Hold 12 provinces',9,12,'flag'],['Treasury of 500 gold',S.gold,500,'treasury'],['Win a war against Austria',0,1,'war'],['Pact with Spain',0,1,'pact']];return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${G.map(g=>{const f=Math.min(1,g[1]/g[2]);return `<div style="background:#100d0a;box-shadow:inset 0 0 0 1px #3a2f1d;padding:14px;display:flex;gap:14px;align-items:center"><svg width="86" height="86" viewBox="0 0 86 86">${bezelSvg(43,43,40,0)}<path d="${arcD(43,43,30,0,359.9)}" stroke="#2a2318" stroke-width="6" fill="none"/><path d="${arcD(43,43,30,0,Math.max(1,359*f))}" stroke="${f>=1?'#69B3A2':'#C9A24B'}" stroke-width="6" fill="none" stroke-linecap="round"/><text x="43" y="48" text-anchor="middle" font-family="Alegreya" font-weight="700" font-size="17" fill="#EFE6CF">${Math.round(f*100)}%</text></svg><div><div class="cz" style="font:700 13.5px/1.25 Cinzel;letter-spacing:.07em">${g[0]}</div><div style="font:italic 16px Alegreya;color:var(--dim);margin-top:3px">${g[1]} of ${g[2]}</div></div></div>`}).join('')}</div>`}
function eventBody(){return `<div style="display:flex;gap:18px;align-items:center;margin-bottom:12px"><div style="width:96px;height:96px;flex:none;position:relative"><svg width="96" height="96" viewBox="0 0 96 96">${bezelSvg(48,48,44,36)}</svg><span style="position:absolute;inset:0;display:grid;place-items:center;color:var(--bad)">${ico('warn',42,1.5)}</span></div><div><div class="cap" style="color:var(--bad)">ULTIMATUM · AUSTRIAN EMPIRE</div><div class="cz" style="font:700 22px/1.15 Cinzel;letter-spacing:.06em;margin-top:4px">Withdraw from the Rhine</div></div></div><div style="font:400 19px/1.4 Alegreya;color:var(--dim);margin-bottom:16px">Vienna demands that French garrisons leave the left bank within a month, or its armies will cross the frontier.</div>
 ${[['Stand firm','war',[['−10 Austria relations','b'],['+5 prestige','g']],1],['Negotiate','envoys',[['−1 envoy','b'],['+10 Austria relations','g']],0],['Withdraw garrisons','move',[['−15 stability','b'],['War averted','g']],0]].map((c,i)=>`<div class="row" style="padding:12px 14px;margin-bottom:8px;background:#100d0a;box-shadow:inset 0 0 0 1px ${c[3]?'#C9A24B':'#3a2f1d'}" data-act="event-${i}"><div class="ring" style="width:42px;height:42px">${ico(c[1],20)}</div><div style="flex:1"><div class="cz" style="font:700 14.5px Cinzel;letter-spacing:.1em">${c[0]}${c[3]?` <span style="color:var(--brass);font-size:11px;letter-spacing:.2em;margin-left:6px">★ ADVISED</span>`:''}</div><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${c[2].map(([t,k])=>`<span class="chip ${k}">${t}</span>`).join('')}</div></div></div>`).join('')}`}
function warBody(){return `<div style="font:400 19px/1.4 Alegreya;color:var(--dim)">Casus belli: border dispute. It costs <b style="color:var(--ivory)">3 envoys</b>, drops your standing with every neutral court and cannot be undone.</div><div style="display:flex;gap:8px;margin-top:14px"><span class="chip b">−3 envoys</span><span class="chip b">−20 relations (neutral)</span><span class="chip n">Truce ends</span></div>`}
function mount(){const sc=$('#screens');sc.innerHTML=
 panel('budget',{icon:'treasury',title:'Budget',sub:'Net income '+(net()>=0?'+':'')+net()+' gold per turn',w:520,h:700,x:300,y:196,body:budgetBody(),foot:'<button class="bt" data-act="revert">Revert</button><button class="bt pri" data-act="close">Done</button>'})+
 panel('nations',{icon:'nations',title:'Nations',sub:'Courts of Europe · 1804',w:960,h:690,x:300,y:196,body:nationBody()})+
 panel('annals',{icon:'annals',title:'Annals',sub:'The chronicle of your reign',w:560,h:700,x:300,y:196,body:annalsBody()})+
 panel('decrees',{icon:'decrees',title:'Decrees',sub:'Enacted by the Emperor · 6 envoys',w:700,h:600,x:300,y:196,body:decreesBody()})+
 panel('council',{icon:'council',title:'Council',sub:'Advice of your ministers',w:620,h:620,x:300,y:196,body:councilBody()})+
 panel('dossier',{icon:'terrain',title:'Bas-Rhin',sub:'Province dossier · France',w:440,h:640,x:1190,y:262,body:dossierBody()})+
 panel('goals',{icon:'goals',title:'Goals',sub:'What the Empire strives for',w:700,h:440,x:300,y:196,body:goalsBody()})+
 panel('event',{icon:'warn',title:'Event',sub:'Turn '+S.turn,w:560,x:680,y:210,cls:'modal',body:eventBody()})+
 panel('war',{icon:'war',title:'Declare war on Austria?',sub:'',w:520,x:700,y:340,cls:'modal',body:warBody(),foot:'<button class="bt" data-act="close2">Cancel</button><button class="bt dng" id="holdbtn"><span class="fill"></span><span class="ic">'+ico('war',18)+'</span>Hold to declare war</button>'});
 wireKnobs();wireHold()}
function wireHold(){const b=$('#holdbtn');if(!b)return;let t0=0,raf=0;const f=b.querySelector('.fill');const step=()=>{const k=Math.min(1,(performance.now()-t0)/600);f.style.width=k*100+'%';if(k>=1){b.dispatchEvent(new Event('done'));return}raf=requestAnimationFrame(step)};
 b.addEventListener('mousedown',()=>{t0=performance.now();raf=requestAnimationFrame(step)});['mouseup','mouseleave'].forEach(e=>b.addEventListener(e,()=>{cancelAnimationFrame(raf);f.style.width='0'}));b.addEventListener('done',()=>{closeScreen();NAT.find(n=>n.id==='austria').st='War';NAT.find(n=>n.id==='austria').rel=-90;toast('bad','War declared on Austria. −3 envoys.');S.envoys-=3;renderTop();if(S.screen==='nations')refreshBody('nations')})}
function refreshBody(k){const m={dossier:dossierBody,nations:nationBody,annals:annalsBody,decrees:decreesBody,council:councilBody,goals:goalsBody,budget:budgetBody,event:eventBody,war:warBody};$('#b_'+k).innerHTML=m[k]();if(k==='budget')wireKnobs()}
function openScreen(k){closeScreen(true);S.screen=k;refreshBody(k);$('#s_'+k).classList.add('on');if(['event','war'].includes(k)||false){$('#scrim').classList.add('on')}$('#scrim').classList.toggle('on',['event','war'].includes(k));renderRail();renderRing();hidePreview();S.moving=false}
function closeScreen(keep){$$('.scr.on').forEach(s=>s.classList.remove('on'));$('#scrim').classList.remove('on');S.screen=null;if(!keep){renderRail();renderRing()}}
function toggleMenu(){const m=$('#menu');if(m.innerHTML){m.innerHTML='';return}m.style.cssText='right:158px;top:104px;width:260px';m.innerHTML=plate(`<div style="padding:8px">${[['play','Resume','Esc'],['save','Save game','S'],['load','Load game','L'],['settings','Settings',''],['flag','Main menu','']].map(([i,l,k])=>`<div class="row" style="padding:11px 12px" data-act="menu-${l}"><span style="color:var(--hi)">${ico(i==='play'?'check':i,20)}</span><span class="cz" style="font:600 13px Cinzel;letter-spacing:.14em;flex:1">${l}</span><span style="font:400 11px 'JetBrains Mono';color:var(--dim2)">${k}</span></div>`).join('')}</div>`,'','',8)}
// ---------------- tooltips, actions, keys
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.classList.remove('on');return}const [a,b,k]=t.dataset.tip.split('|');tip.innerHTML=plate(`<div style="padding:11px 14px 10px"><div class="tt">${a}</div><div class="tb">${b}</div>${k?`<div class="tk">${k}</div>`:''}</div>`,'','',6);const st=$('#stage').getBoundingClientRect(),r=t.getBoundingClientRect(),sc=st.width/1920;let x=(r.left-st.left)/sc+r.width/sc/2-110,y=(r.bottom-st.top)/sc+12;if(y>960)y=(r.top-st.top)/sc-100;tip.style.left=Math.max(10,Math.min(1600,x))+'px';tip.style.top=y+'px';tip.classList.add('on')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-nat],[data-dec],[data-af]');if(!t)return;
 if(t.dataset.nat){S.nation=t.dataset.nat;refreshBody('nations');return}
 if(t.dataset.dec!==undefined){S.decrees[+t.dataset.dec]=1;S.envoys-=DEC[+t.dataset.dec][3];refreshBody('decrees');renderTop();toast('good','Decree enacted: '+DEC[+t.dataset.dec][0]);return}
 if(t.dataset.af!==undefined){S.annalsF=+t.dataset.af;refreshBody('annals');return}
 const a=t.dataset.act;if(a==='dossier'){S.screen==='dossier'?closeScreen():openScreen('dossier');return}if(a==='close'||a==='close2'){closeScreen();return}
 if(['budget','nations','annals','decrees','council','goals'].includes(a)){S.screen===a?closeScreen():openScreen(a);return}
 if(a==='confirm-move')confirmMove();if(a==='cancel-move'){S.moving=false;hidePreview();renderRing()}
 if(a==='dip-pact'){NAT.find(n=>n.id===S.nation).rel+=15;S.envoys--;renderTop();refreshBody('nations');toast('good','Pact proposed.')}
 if(a==='dip-trade')toast('good','Trade route opened (+14 gold / turn).');if(a==='dip-envoy'){NAT.find(n=>n.id===S.nation).rel+=8;S.envoys--;renderTop();refreshBody('nations');toast('good','Envoy sent. Relations improve.')}
 if(a==='dip-war'){closeScreen(true);S.screen='war';$('#s_war').classList.add('on');$('#scrim').classList.add('on')}
 if(a&&a.startsWith('event-')){closeScreen();toast(a==='event-0'?'bad':'good',['You stand firm. Austria mobilises.','Envoy dispatched to Vienna.','Garrisons withdrawn.'][+a.slice(6)])}
 if(a&&a.startsWith('goto-'))openScreen({army:'budget',dip:'nations',int:'decrees'}[a.slice(5)]);
 if(a==='revert'){S.bud={tax:50,goods:20,research:15,invest:15};S.gdelta=731;refreshBody('budget');renderTop()}
 if(a&&a.startsWith('menu-')){$('#menu').innerHTML='';toast('info',a.slice(5)+' (demo)')}});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'){if($('#menu').innerHTML)return toggleMenu();if(S.moving||S.target){S.moving=false;hidePreview();renderRing();return}if(S.screen)closeScreen();else toggleMenu();return}
 const m={n:'nations',b:'budget',d:'decrees',c:'council',a:'annals',g:'goals'};if(m[k]){S.screen===m[k]?closeScreen():openScreen(m[k])}if(k==='m')verb('move');if(k==='enter'){if(S.target)confirmMove();else endTurn()}});
// ---------------- init
mount();renderAlerts();renderTop();renderRail();renderTuner();renderMM();renderChrono();selFill();renderRing();hookTargets();fit();
window.demo={go(s){$('#toasts').innerHTML='';closeScreen();$('#menu').innerHTML='';hidePreview();S.moving=false;renderRing();
 if(s==='map'){}else if(s==='move'){verb('move')}else if(s==='preview'){verb('move');showPreview('kingdom_of_sardinia',true)}else if(s==='menu'){toggleMenu()}else if(s==='tip'){const t=$('.g');t.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}))}else if(s==='tip2'){const t=$('.rv');t.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}))}else if(s==='lens'){S.lens=1;renderTuner();recolor()}else openScreen(s)}};
const q=new URLSearchParams(location.search).get('s');if(q)setTimeout(()=>demo.go(q),200);
</script></body></html>
