 {id:'austria',cid:'austrian_empire',name:'Austrian Empire',code:'AT',ruler:'Emperor Francis II',rel:-42,st:'Hostile',army:112,eco:'Strong',note:'Mobilising on your eastern border.'},

NAT.forEach(n=>{n.why=WHY[n.id];n.mods=[];n.pact=0;n.tradeOn=0;n.tradeIn=0;n.war=0;n.warT=0;n.truce=0;n.cd={pact:0,peace:0}});
{const u=NAT.find(n=>n.id==='uk');u.war=1;u.warT=4;u.mods.push({k:'At war',v:-50})}

const unmod=(n,k)=>{n.mods=n.mods.filter(m=>m.k!==k)};

 const eGain=Math.min(gain(n,8),24-eg),gGain=Math.min(gain(n,10),20-gg);

 const pOff=n.pact?{off:'A pact is already in force.'}:n.war?{off:'You are at war.'}:n.rel<=-20?{off:'They will not hear it: relations must be above −20.'}:n.cd.pact>0?{off:'Rebuffed. Try again in '+T(n.cd.pact)+'.'}:S.envoys<1?{off:'You need 1 envoy.'}:{};

 const eOff=n.war?{off:'Envoys cannot cross the lines.'}:eg>=24?{off:'Goodwill from envoys is at its peak (+24).'}:S.envoys<1?{off:'You need 1 envoy.'}:{};
 const gOff=n.war?{off:'No gifts in wartime.'}:gg>=20?{off:'They already feel generously treated (+20).'}:S.gold<30?{off:'A gift costs 30 gold.'}:{};
 const wOff=n.war?(n.cd.peace>0?{off:'They refuse to talk for '+T(n.cd.peace)+'.'}:S.envoys<1?{off:'You need 1 envoy.'}:{}):n.truce>0?{off:'Truce: '+T(n.truce)+' remain.'}:S.envoys<3?{off:'War needs 3 envoys.'}:{};
 return [
 {k:'pact',ic:'pact',l:'Pact',sub:n.pact?'✓':pp.p+'%',...pOff,tip:['Pact',`Costs 1 envoy, even if refused. Signed: <b class="pos">+25 relations</b> while it holds, +25% trade income. Refused: <b class="neg">−4 for 3 turns</b>, no new offers for 2.${rows([['Base','50%'],['Relations',sg(pp.rel)+'%'],['Trade ties',pp.tr?sg(pp.tr)+'%':'—'],['Relative strength',sg(pp.st)+'%'],['Odds',pp.p+'%','sum']])}`]},

document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-nat],[data-dec],[data-af],[data-bud]');if(!t)return;
 if(t.dataset.bud){const [k,d]=t.dataset.bud.split(':');S.bud[k]=Math.max(0,Math.min(100,S.bud[k]+ +d));budgetUpdate();return}
 if(t.dataset.nat){S.nation=t.dataset.nat;refresh('nations');return}
 if(t.dataset.dec!==undefined){S.decrees[+t.dataset.dec]=1;S.envoys-=DEC[+t.dataset.dec][3];refresh('decrees');renderTop();toast('good','Decree enacted: '+DEC[+t.dataset.dec][0]);return}
 if(t.dataset.af!==undefined){S.af=+t.dataset.af;refresh('annals');return}
 const a=t.dataset.act;if(!a)return;
 if(a==='zin'){zoomAt(1.3);return}if(a==='zout'){zoomAt(1/1.3);return}
 if(a.startsWith('nat:')){S.nation=a.slice(4);openScreen('nations');return}
 if(a==='dossier'){S.screen==='dossier'?closeScreen():openScreen('dossier');return}
 if(a==='close'||a==='close2'){closeScreen();return}
 if(['budget','nations','annals','decrees','council','goals','event'].includes(a)){S.screen===a?closeScreen():openScreen(a);return}
 if(a==='confirm-move')confirmMove();if(a==='cancel-move')cancelMove();
 if(a.startsWith('dip-')&&a!=='dip-war'){dipAct(a.slice(4));return}
 if(a==='dip-war'){const A=acts(nat()).find(x=>x.k==='war');if(A.off){toast('bad',A.off);return}closeScreen(true);S.screen='war';$('#s_war .t').textContent='Declare war on '+NAT.find(n=>n.id===S.nation).name+'?';$('#s_war').classList.add('on');$('#scrim').classList.add('on')}
 if(a.startsWith('event-')){closeScreen();toast(a==='event-0'?'bad':'good',['You stand firm. Austria mobilises.','Envoy dispatched to Vienna.','Garrisons withdrawn.'][+a.slice(6)])}
 if(a.startsWith('goto-'))openScreen({army:'budget',dip:'nations',int:'decrees'}[a.slice(5)]);
 if(a==='revert'){S.bud={tax:50,goods:20,research:15,invest:15};refresh('budget');renderTop();$('#s_budget .s').textContent='Net income '+(net()>=0?'+':'')+net()+' gold per turn'}
 if(a.startsWith('menu-')){$('#menu').innerHTML='';toast('info',a.slice(5)+' (not in this demo)')}});
addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('role')==='button'){document.activeElement.click();e.preventDefault();return}if(e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();if(k==='escape'){if($('#menu').innerHTML)return toggleMenu();if(S.moving||S.target){cancelMove();return}if(S.screen)closeScreen();else toggleMenu();return}
 const m={n:'nations',b:'budget',d:'decrees',c:'council',a:'annals',g:'goals'};if(m[k]){S.screen===m[k]?closeScreen():openScreen(m[k])}if(k==='m')verb('move');if(k==='+'||k==='=')zoomAt(1.3);if(k==='-')zoomAt(1/1.3);if(k==='enter'){if(S.target||S.pv&&S.moving)confirmMove();else if(!S.screen)endTurn()}});
// ===================================================================== init
function build2(){mount();renderTop();renderRail();renderTuner();renderMM();renderChrono();renderAlerts();selFill();recolor();applyCam();$('#menu').innerHTML=''}
function build(){layout();build2()}
addEventListener('resize',()=>{const was=L.phone;layout();if(was!==L.phone||true){mount();renderTop();renderRail();renderTuner();renderMM();renderChrono();renderAlerts();if(S.screen)$('#s_'+S.screen)?.classList.add('on');applyCam()}});
build();
const _a=applyCam;applyCam=function(){_a();updateMMV()};
window.demo={go(s){$('#toasts').innerHTML='';closeScreen();$('#menu').innerHTML='';hidePreview();S.moving=false;renderDyn();
 if(s==='map'){}else if(s==='move'){verb('move')}else if(s==='preview'){verb('move');showPreview('kingdom_of_sardinia',true)}else if(s==='menu'){toggleMenu()}else if(s==='nat'){S.sel={kind:'nat',id:'austrian_empire'};selFill();renderDyn();applyCam()}else if(s==='tip'){tipEl=null;showTip($('.g'))}else if(s==='tip2'){const e=$('.rv');tipEl=e;showTip(e)}else if(s==='lens'){S.lens=1;renderTuner();recolor()}else if(s==='zoom'){cam.ms=cam.fit*2.2;cam.cx=MAP.france[0].cx;cam.cy=MAP.france[0].cy;applyCam()}else if(s==='battle'){openScreen('battle',{win:true,t:TGT.kingdom_of_sardinia})}else openScreen(s)}};
const q=new URLSearchParams(location.search).get('s');if(q)setTimeout(()=>demo.go(q),250);
</script></body></html>
