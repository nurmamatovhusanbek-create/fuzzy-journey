<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Bellum — pop-up mock-ups</title>
<style>
/*FONTS*/
/*BEZELCSS*/
html,body{overflow:hidden;height:auto;background:#000}
body{font-feature-settings:'lnum' 1}
#stg{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0A0D12 url(mock_assets/game_bg.jpg) 0 0/1920px 1080px no-repeat}
.scrim{position:absolute;inset:0;background:rgba(3,5,8,.58)}
.vigl{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(2,4,8,.72) 100%);pointer-events:none}
.abs{position:absolute}
/* ===== modal chrome (as the game's) ===== */
.md{position:absolute;filter:drop-shadow(0 22px 34px rgba(0,0,0,.7));display:flex;left:50%;top:50%;transform:translate(-50%,-50%)}
.md .o{flex:1;min-width:0;display:flex;background:var(--lo);padding:1px;clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px),0 13px)}
.md .o>.i{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,#1d1812,#13100c);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);box-shadow:inset 0 0 0 3px #13100c,inset 0 0 0 4px rgba(201,162,75,.22)}
.md .hd{padding:18px 24px 12px;gap:14px;flex:none;display:flex;align-items:center}
.md .hd .t{font:700 22px/1.05 Cinzel;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.md .hd .s{font:italic 16px Alegreya;color:var(--dim);margin-top:4px;white-space:nowrap}
.md .ring{width:46px;height:46px}
.md .rule{flex:none;margin:0 24px}
.md .bd{padding:16px 24px 18px}
.md .ft{display:flex;gap:12px;padding:14px 24px 18px;border-top:1px solid #33291a;align-items:center;justify-content:space-between}
.md .bt{height:42px;padding:0 20px;font-size:13px}
.hdr-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.cz{font-family:Cinzel,serif;text-transform:uppercase}
.cap{font:600 11px Cinzel;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.lead2{font:italic 16px/1.35 Alegreya;color:var(--dim)}
.pos{color:var(--good)}.neg{color:#ee8a68}.dim{color:var(--dim)}
.ld{display:flex;align-items:baseline;gap:8px;font:500 17px Alegreya}.ld>.dot{flex:1;border-bottom:1px dotted #5a4a26;transform:translateY(-4px);min-width:10px}
.med{display:inline-grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 38% 32%,#2a2218,#0f0c09);color:var(--hi);flex:none;position:relative}
.fm{display:inline-block;border-radius:50%;overflow:hidden;flex:none;background:#0c0a07 center/cover no-repeat;box-shadow:0 0 0 2px #0f0c09,0 0 0 3.5px rgba(201,162,75,.85),0 0 0 6px rgba(0,0,0,.4)}
.chipx{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;font:600 15px Alegreya;background:#100d09;box-shadow:inset 0 0 0 1px #3a2f1d}
.chipx.g{color:var(--good)}.chipx.b{color:#ee8a68}.chipx.i{color:var(--info)}.chipx.n{color:var(--dim)}
/* ===== war declaration ===== */
.rust .o{background:#a8442b}
.rust .o>.i{background:linear-gradient(180deg,#2a1710,#16100c);box-shadow:inset 0 0 0 3px #16100c,inset 0 0 0 4px rgba(224,121,90,.28)}
.rust .ring{box-shadow:0 0 0 1.3px #e0795a,0 0 0 3px rgba(0,0,0,.45),0 0 18px rgba(224,121,90,.35);color:#f0a184}
.faceoff{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px;position:relative}
.side{display:flex;flex-direction:column;align-items:center;gap:9px;width:250px;text-align:center}
.side b{font:700 16px Cinzel;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.side i{font:italic 15px Alegreya;color:var(--dim)}
.vs{position:relative;width:96px;height:96px;display:grid;place-items:center}
.vs::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(224,121,90,.34),rgba(224,121,90,0) 70%)}
.vs .d{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#4a2418,#150c08);box-shadow:0 0 0 1.5px #e0795a,0 0 0 4px rgba(0,0,0,.5),0 0 22px rgba(224,121,90,.55);color:#ffb89e}
.facerule{position:absolute;left:150px;right:150px;top:50%;height:1px;background:linear-gradient(90deg,transparent,#a8442b 25%,#a8442b 75%,transparent)}
.seal{position:relative;width:92px;height:92px;flex:none}
.seal .rg{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#e0795a var(--p),#33201a 0);-webkit-mask:radial-gradient(circle,transparent 39px,#000 40px);mask:radial-gradient(circle,transparent 39px,#000 40px)}
.seal .wx{position:absolute;inset:10px;border-radius:50%;display:grid;place-items:center;color:#ffe3d6;background:radial-gradient(circle at 36% 30%,#d9683f,#8e3822 62%,#5b2214);box-shadow:inset 0 2px 3px rgba(255,200,170,.45),inset 0 -3px 6px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.55)}
.seal .wx::after{content:'';position:absolute;inset:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,214,190,.35)}
.holdlbl{font:700 14px Cinzel;letter-spacing:.17em;text-transform:uppercase;color:#f3b199}
/* ===== event ===== */
.illus{position:relative;height:150px;margin:-2px -24px 0;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid #33291a}
.illus .wash{position:absolute;inset:0}
.illus .ticks{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#7F6A33 0 1px,transparent 1px 8px);opacity:.6}
.illus svg.bg{position:absolute;inset:0;opacity:.5}
.choice{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-top:10px;background:linear-gradient(180deg,#1a140e,#120e0a);box-shadow:inset 0 0 0 1px #4a3d22;position:relative}
.choice.hot{box-shadow:inset 0 0 0 1.5px var(--hi),0 0 22px rgba(229,199,122,.16);background:linear-gradient(90deg,#33270f,#1a140e 70%)}
.choice .h{font:700 15px Cinzel;letter-spacing:.14em;text-transform:uppercase}
.choice .fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.choice .go{margin-left:auto;color:var(--hi);opacity:.9}
.vsbar{display:flex;align-items:center;gap:12px;font:500 16px Alegreya;margin:6px 0 2px}
.vsbar .tr{position:relative;flex:1;height:10px;background:#0c0a07;box-shadow:inset 0 0 0 1px #4a3f28}
.vsbar .a{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#e5c77a,#a8842f)}
.vsbar .b{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(180deg,#d9683f,#9d3a22)}
/* ===== battle / generic bars ===== */
.army{flex:1;display:flex;flex-direction:column;gap:8px}
.army .row{display:flex;justify-content:space-between;font:500 17px Alegreya}
.army .tr{position:relative;height:14px;background:#0c0a07;box-shadow:inset 0 0 0 1px #4a3f28;overflow:hidden}
.army .after{position:absolute;left:0;top:0;bottom:0}
.army .lost{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(210,96,63,.8) 0 4px,rgba(210,96,63,.35) 4px 8px)}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:54px;margin:0 -24px;background:linear-gradient(90deg,transparent,rgba(201,162,75,.22) 18%,rgba(201,162,75,.3) 50%,rgba(201,162,75,.22) 82%,transparent);border-top:1px solid #5a4a26;border-bottom:1px solid #5a4a26}
.ribbon b{font:700 24px Cinzel;letter-spacing:.3em;color:var(--hi)}
.mk{position:absolute;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:20px;background:#120d09;box-shadow:0 0 0 1.5px #e0795a,0 0 26px rgba(224,121,90,.6);font:700 18px Alegreya;color:#ffd7c6}
.mk .sw{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#4a2418;color:#ffb89e}
/* ===== treaty ===== */
.sheet{position:relative;margin:2px 0 6px;padding:20px 26px 18px;background:linear-gradient(180deg,#23190f,#18110a);box-shadow:inset 0 0 0 1px #5a4a26,inset 0 0 0 4px #18110a,inset 0 0 0 5px rgba(201,162,75,.2)}
.sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px}
.sig .l{width:230px;border-top:1px solid #7F6A33;padding-top:6px;text-align:center;font:italic 15px Alegreya;color:var(--dim)}
.wax{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.wax.red{background:radial-gradient(circle at 36% 30%,#d9683f,#8e3822 62%,#5b2214);box-shadow:inset 0 2px 3px rgba(255,200,170,.45),inset 0 -3px 6px rgba(0,0,0,.5),0 5px 12px rgba(0,0,0,.6)}
.wax.brz{background:radial-gradient(circle at 36% 30%,#e5c77a,#a8842f 62%,#5d4818);box-shadow:inset 0 2px 3px rgba(255,244,210,.5),inset 0 -3px 6px rgba(0,0,0,.45),0 5px 12px rgba(0,0,0,.6)}
.wax::after{content:'';position:absolute;inset:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,235,215,.32)}
.wax .fm{box-shadow:0 0 0 1.5px rgba(0,0,0,.45)}
/* ===== turn summary ===== */
.drw{position:absolute;right:46px;top:112px;width:560px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.65))}
.sr{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid #261f15;font:500 18px Alegreya}
.sr .m{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#2a2218,#0f0c09);box-shadow:0 0 0 1.2px rgba(201,162,75,.6);color:var(--hi);flex:none}
.sr .m.b{box-shadow:0 0 0 1.2px #e0795a;color:#f0a184}
.sr .m.g{box-shadow:0 0 0 1.2px #69B3A2;color:#8fd1c1}
.sr small{display:block;font:italic 14px Alegreya;color:var(--dim);margin-top:1px}
.sr .go{margin-left:auto;color:var(--lo)}
.sr:hover .go{color:var(--hi)}
/* ===== finale ===== */
.fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.fin .vt{font:700 118px/1 Cinzel;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;padding-left:.2em;background:linear-gradient(180deg,#fff0bf 0%,#e5c77a 40%,#b8903f 66%,#e0c071 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2a0c) drop-shadow(0 0 40px rgba(229,199,122,.35))}
.fin.lost .vt{background:linear-gradient(180deg,#d8cdbb 0%,#a89c80 45%,#6c6350 70%,#9d927b 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #1a140e) drop-shadow(0 0 40px rgba(210,96,63,.25))}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:170px}
.stat b{font:700 54px/1 Alegreya;letter-spacing:.01em;color:var(--ivory)}
.chron{display:flex;flex-direction:column;gap:0;width:760px}
.chron div{display:flex;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid #261f15;font:500 19px Alegreya}
.chron em{font:700 14px Cinzel;letter-spacing:.14em;color:var(--hi);font-style:normal;width:86px;flex:none}
.cinebar{position:absolute;left:0;right:0;background:#000}
.banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.tag{position:absolute;left:20px;top:14px;font:600 13px Cinzel;letter-spacing:.2em;color:#d9c58f;background:rgba(0,0,0,.6);padding:6px 12px;z-index:50}
</style></head><body>
<div id="stg"></div>
<script>/*KIT*/</script>
<script>
document.body.insertAdjacentHTML('afterbegin',typeof DEFS!=='undefined'?DEFS:'');
Object.assign(IC,{
  chev:'<path d="M9 5l7 7-7 7"/>',up:'<path d="M12 18V6M6 11l6-6 6 6"/>',down:'<path d="M12 6v12M6 13l6 6 6-6"/>',
  pen:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>',fist:'<path d="M7 11V7a1.5 1.5 0 013 0v-1a1.5 1.5 0 013 0v1a1.5 1.5 0 013 0v7a5 5 0 01-5 5H11a5 5 0 01-4-2l-2-3 2-1z"/>',
  wheat:'<path d="M12 21V9M12 9c-3 0-4-2-4-4 3 0 4 2 4 4zM12 9c3 0 4-2 4-4-3 0-4 2-4 4zM12 14c-3 0-4-2-4-4 3 0 4 2 4 4zM12 14c3 0 4-2 4-4-3 0-4 2-4 4zM12 19c-3 0-4-2-4-4 3 0 4 2 4 4zM12 19c3 0 4-2 4-4-3 0-4 2-4 4z"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.500 8.500l-2 5-5 2 2-5z"/>',dove:'<path d="M3 14c4 0 6-2 8-6 1 2 3 3 6 3l4-3c-1 6-5 11-11 11-3 0-5-2-7-5z"/>'
});
const FL=(c,s=64,x='')=>`<span class="fm" style="width:${s}px;height:${s}px;background-image:url(../../godot/assets/flags/napoleonic/${c}_c.png);${x}"></span>`;
const ring=(ic,s=46)=>`<div class="ring">${ico(ic,Math.round(s*.5),1.7)}</div>`;
const xb=`<div class="xbtn">${ico('close',16)}</div>`;
const shell=o=>`<div class="md ${o.cls||''}" style="width:${o.w}px;${o.style||''}"><div class="o"><div class="i">
<div class="hd">${ring(o.icon)}<div><div class="t">${o.title}</div>${o.sub?`<div class="s">${o.sub}</div>`:''}</div><div class="hdr-r">${o.hr||''}${o.nox?'':xb}</div></div><div class="rule"><i></i></div>
<div class="bd">${o.body}</div>${o.foot?`<div class="ft">${o.foot}</div>`:''}</div></div></div>`;
const chip=(k,ic,t)=>`<span class="chipx ${k}">${ico(ic,15,2)}${t}</span>`;
const cancel=`<button class="bt">Cancel</button>`;
const q=new URLSearchParams(location.search),M=q.get('m')||'war1';
let h='',tag='',veil=true;
/* ---------- B3 war declaration ---------- */
const warBody=`<div class="lead2" style="margin:0 0 4px">You have no casus belli, neighbours may form a coalition against you. It costs <b style="color:var(--ivory);font-style:normal">3 envoys</b> and cannot be undone.</div>
 <div class="faceoff"><div class="facerule"></div>
  <div class="side">${FL('france',84)}<b>France</b><i>Emperor Napoleon</i></div>
  <div class="vs"><div class="d">${ico('war',30,1.7)}</div></div>

 <div style="margin-top:10px;display:grid;gap:7px">
  <div class="ld"><span>Envoys</span><span class="dot"></span><b class="neg">−3</b></div>
  <div class="ld"><span>Their grudge</span><span class="dot"></span><b class="neg">+40</b></div>
  <div class="ld"><span>Infamy</span><span class="dot"></span><b class="neg">+8</b></div></div>`;
const warFoot=p=>`${cancel}<div style="display:flex;align-items:center;gap:16px"><span class="holdlbl">${p>0?(p>=100?'War is declared':'Keep holding…'):'Hold to declare war'}</span><div class="seal" style="--p:${p*3.6}deg"><div class="rg"></div><div class="wx">${ico('war',30,1.8)}</div></div></div>`;

if(M==='war2'){tag='B3 · War declaration — holding the seal (60 %): card warms, map edges redden';h=`<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(140,40,20,.38) 100%)"></div>`+shell({cls:'rust',w:700,icon:'war',title:'Declare war on',sub:'Austrian Empire?',body:warBody,foot:warFoot(60),style:'filter:drop-shadow(0 22px 34px rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(224,121,90,.28))'})}
if(M==='war3'){tag='B3 · War declaration — the moment: letterbox, banner, the map turns to the front';veil=false;
 h=`<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(16,6,4,.78) 20%,rgba(6,3,2,.94) 100%)"></div>
 <div class="cinebar" style="top:0;height:150px"></div><div class="cinebar" style="bottom:0;height:150px"></div>
 <div class="abs" style="left:0;right:0;top:380px;text-align:center">
  <div style="display:flex;justify-content:center;align-items:center;gap:60px">${FL('france',110)}<div style="width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(224,121,90,.35),transparent 70%);color:#ffb89e">${ico('war',64,1.5)}</div>${FL('austrian_empire',110)}</div>
  <div class="cz" style="font:700 60px Cinzel;letter-spacing:.24em;margin-top:34px;color:#f3d9c9;text-shadow:0 0 36px rgba(224,121,90,.6)">War</div>
  <div style="font:italic 26px Alegreya;color:#d8b9a6;margin-top:10px">France declares war on the Austrian Empire</div>
  <div style="margin:22px auto 0;width:560px;height:1px;background:linear-gradient(90deg,transparent,#e0795a,transparent)"></div>
  <div class="cz" style="font:600 14px Cinzel;letter-spacing:.3em;color:#a89c80;margin-top:14px">Turn 1 · 1804</div></div>
`}
/* ---------- B2 event ---------- */
const evGlyph=(ic,col,glow)=>`<div class="illus"><div class="wash" style="background:radial-gradient(ellipse at 50% 60%,${glow},transparent 70%),linear-gradient(180deg,#1b1510,#110d09)"></div>
 <svg class="bg" width="100%" height="150" viewBox="0 0 640 150" preserveAspectRatio="none"><g stroke="${col}" stroke-opacity=".25" fill="none">${[40,80,120].map(r=>`<circle cx="320" cy="82" r="${r+20}"/>`).join('')}${Array.from({length:30},(_,i)=>`<line x1="${320+Math.cos(i*Math.PI/15)*70}" y1="${82+Math.sin(i*Math.PI/15)*70}" x2="${320+Math.cos(i*Math.PI/15)*150}" y2="${82+Math.sin(i*Math.PI/15)*150}"/>`).join('')}</g></svg>
 <div class="med" style="width:92px;height:92px;box-shadow:0 0 0 1.5px ${col},0 0 0 5px rgba(0,0,0,.45),0 0 30px ${glow};color:${col}">${ico(ic,46,1.5)}</div><div class="ticks"></div></div>`;
if(M==='ev1'||M==='ev2'){tag=M==='ev1'?'B2 · Event with an illustration band and effect chips':'B2 · Same event, second choice hovered';
 h=shell({w:700,icon:'warn',title:'Event',sub:'Turn 1 · January 1804',body:`${evGlyph('fist','#f0a184','rgba(224,121,90,.4)')}
 <div style="display:flex;align-items:baseline;gap:12px;margin-top:16px"><span class="cap" style="color:#e0795a">Ultimatum · Rebels</span></div>
 <div class="cz" style="font:700 24px Cinzel;letter-spacing:.1em;margin-top:4px">Ultimatum from Rebels</div>
 <div style="font:500 19px/1.4 Alegreya;margin-top:8px;color:#e4dcc6">Rebels demand the province of Andorra la Vella. Yield it, or face war.</div>
 <div class="vsbar"><span class="dim">Their strength 0</span><div class="tr"><div class="b" style="width:2%"></div><div class="a" style="width:96%"></div></div><span>Yours 2699</span></div>
 <div class="choice ${M==='ev1'?'hot':''}"><div class="med" style="width:46px;height:46px">${ico('flag',22)}</div><div><div class="h">Yield the province</div><div class="fx">${chip('b','terrain','Andorra la Vella')}${chip('b','down','−1 province')}${chip('g','heart','Peace restored')}</div></div><div class="go">${ico('chev',22,2)}</div></div>
 <div class="choice ${M==='ev2'?'hot':''}"><div class="med" style="width:46px;height:46px">${ico('attack',22)}</div><div><div class="h">Defy them</div><div class="fx">${chip('b','war','War with Rebels')}${chip('g','up','+6 prestige')}${chip('n','clock','Rebels −1 per turn')}</div></div><div class="go">${ico('chev',22,2)}</div></div>`})}
if(M==='evglyphs'){tag='B2 · Engraved glyph per event class (illustration band)';veil=true;h='<div class="abs" style="inset:0;background:rgba(4,5,8,.82)"></div>';
 const cls=[['Plague','skull','#8fd1c1','rgba(105,179,162,.4)'],['Court & succession','crown','#E5C77A','rgba(229,199,122,.38)'],['Rebellion','fist','#f0a184','rgba(224,121,90,.4)'],['Trade & harvest','ship','#7FA8E8','rgba(127,168,232,.38)'],['Discovery','compass','#d9c58f','rgba(201,162,75,.35)'],['War & battle','war','#f0a184','rgba(210,96,63,.4)'],['Diplomacy','dove','#7FA8E8','rgba(127,168,232,.34)'],['Famine & weather','wheat','#c9b36a','rgba(180,150,70,.34)']];
 h+=cls.map(([n,ic,c,g],i)=>`<div class="abs" style="left:${70+(i%4)*455}px;top:${150+Math.floor(i/4)*420}px;width:420px"><div style="position:relative;width:420px;height:300px;background:linear-gradient(180deg,#1d1812,#13100c);box-shadow:inset 0 0 0 1px #5a4a26;overflow:hidden">${evGlyph(ic,c,g).replace('class="illus"','class="illus" style="margin:0;height:300px;border:0"').replace('height="150" viewBox="0 0 640 150"','height="300" viewBox="0 0 640 150"')}</div><div class="cz" style="font:700 15px Cinzel;letter-spacing:.2em;margin-top:12px;text-align:center;color:var(--hi)">${n}</div></div>`).join('')}
