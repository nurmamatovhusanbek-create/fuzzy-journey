<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bezel — income readout variations</title>
<style>
/*FONTS*/
/*BEZELCSS*/
html,body{overflow:auto;height:auto}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font:700 22px Cinzel;letter-spacing:.2em;text-transform:uppercase}
.lead{font:italic 17px/1.4 Alegreya;color:var(--dim);margin:6px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:22px}
.card{position:relative}
.tag{position:absolute;left:14px;top:-12px;z-index:2;font:700 12px Cinzel;letter-spacing:.2em;color:#1b1408;background:linear-gradient(180deg,#E5C77A,#B38F3E);padding:4px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.cap2{font:500 13px Alegreya;font-style:italic;color:var(--dim);padding:0 18px 14px}
.hdr{display:flex;align-items:center;gap:14px;padding:16px 18px 6px}
.zero{opacity:.55}
.pos{color:var(--good)}.neg{color:#ee8a68}
.sz{display:flex;gap:6px;margin-bottom:18px}
/* A plates */
.A{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 14px}
.A .pl{--c:6px}
.A .pw{filter:none}
.A .in{padding:7px 12px 7px 10px;display:flex;align-items:center;gap:9px;min-width:104px}
.A .in i{display:block;width:3px;align-self:stretch;border-radius:1px}
.A .lb{font:600 9.5px Cinzel;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;line-height:1}
.A .vl{font:700 21px/1 Alegreya;margin-top:4px;display:flex;align-items:center;gap:5px}
.A .net .plate{background:#E5C77A}.A .net .pin{background:linear-gradient(180deg,#d9b65f,#a8842f);box-shadow:inset 0 1px 0 #f6e4b0}
.A .net .lb{color:#3a2c0c}.A .net .vl{color:#1b1408}
/* C ledger */
.C{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;padding:4px 18px 14px}
.C .r{padding:5px 0 7px;border-bottom:1px dotted #3a2f1d}
.C .r .t{display:flex;align-items:baseline}
.C .r .t .l{font:400 17px Alegreya;color:var(--dim)}.C .r .t .d{flex:1;border-bottom:2px dotted #4a3d22;margin:0 8px;transform:translateY(-4px)}.C .r .t .v{font:700 19px Alegreya}
.C .r .b{height:4px;background:#0c0a07;margin-top:4px;box-shadow:inset 0 0 0 1px #2d2415}.C .r .b u{display:block;height:4px}
.C .sum{grid-column:1/3;border-top:4px double #6b5a30;margin-top:8px;padding-top:8px;display:flex;align-items:baseline}.C .sum .l{font:700 12px Cinzel;letter-spacing:.22em;color:var(--hi)}.C .sum .d{flex:1}.C .sum .v{font:700 30px Alegreya;color:var(--good)}
/* D medals */
.D{display:flex;align-items:flex-start;padding:6px 14px 16px;position:relative;gap:0;flex-wrap:nowrap}
.D .m{width:76px;text-align:center;position:relative}
.D .m .vv{font:700 19px/1 Alegreya;margin-top:3px}.D .m .ll{font:600 9px Cinzel;letter-spacing:.18em;color:var(--dim);margin-top:3px}
.D .eq{width:26px;text-align:center;font:700 26px/52px Alegreya;color:var(--lo)}
.D .rl{position:absolute;left:44px;right:44px;top:32px;height:1px;background:var(--lo);z-index:0}
.D .m svg{position:relative;z-index:1}
/* E drums */
.E{display:flex;flex-wrap:wrap;gap:12px;padding:6px 18px 16px}
.E .u{text-align:center}
.E .w{display:flex;gap:2px;padding:3px;background:linear-gradient(180deg,#d9b65f,#8a6c2a);border-radius:3px}
.E .d{width:20px;height:32px;background:#0c0906;border-radius:2px;box-shadow:inset 0 5px 7px rgba(0,0,0,.9),inset 0 -5px 7px rgba(0,0,0,.9);font:700 23px/32px 'JetBrains Mono';text-align:center;color:#F2E6C5}
.E .d.s{width:16px;font-size:20px}
.E .d.p{color:#8fd8c4}.E .d.n{color:#ff9a78}.E .d.z{color:#6f6650}
.E .lb{font:600 9.5px Cinzel;letter-spacing:.2em;color:var(--dim);margin-top:5px}
/* F gauges */
.F{display:flex;flex-wrap:nowrap;gap:6px 6px;padding:4px 18px 14px;align-items:flex-start}
.F .g{text-align:center;width:68px}.F .g .ll{font:600 9.5px Cinzel;letter-spacing:.18em;color:var(--dim);margin-top:-4px}
</style></head><body><main>
<h1>Income readout — six ways</h1>
<p class="lead">The pill chips read as a web UI. These keep the numbers but make them instruments, plates or ledger lines. Same data in each: taxes +640, trade +180, provinces 0, upkeep −62, spending −27, net +731. A zero is neutral, not green.</p>
<div class="grid" id="g"></div>
</main>
<script>
/*MAPDATA*/
/*KIT*/
document.body.insertAdjacentHTML('afterbegin',DEFS);
const D=[['Taxes',640,'tax'],['Trade',180,'trade'],['Provinces',0,'flag'],['Upkeep',-62,'army'],['Spending',-27,'invest']];
const NET=D.reduce((a,b)=>a+b[1],0),MAXV=820;
const sg=v=>v>0?'+':v<0?'−':'';const ab=v=>Math.abs(v);
const cls=v=>v>0?'pos':v<0?'neg':'zero';
const col=v=>v>0?'#69B3A2':v<0?'#D2603F':'#6f6650';
const tri=v=>v===0?'':`<svg width="9" height="9" viewBox="0 0 9 9" style="display:block"><path d="${v>0?'M4.5 1L8.5 8H.5z':'M4.5 8L.5 1h8z'}" fill="${col(v)}"/></svg>`;
function card(letter,title,desc,html){return `<div class="card"><span class="tag">${letter}</span>${plate(`<div class="hdr"><div class="cap">NET INCOME</div><div style="flex:1"></div><div class="cap" style="color:var(--dim2)">${title}</div></div>${html}<div class="cap2">${desc}</div>`,'','',12)}</div>`}
const A=card('A','PLATES','Notched plates cut like the panels. A coloured edge and a small triangle carry the sign; the label is a caption, the number is the figure. Net is a brass plate.',
 `<div class="A">${D.map(([l,v])=>plate(`<div class="in ${cls(v)}"><i style="background:${col(v)}"></i><div><div class="lb">${l}</div><div class="vl ${cls(v)}">${tri(v)}${v===0?'0':sg(v)+ab(v)}</div></div></div>`,'pl','',6)).join('')}${plate(`<div class="in"><div><div class="lb">Net</div><div class="vl">= +${NET}</div></div></div>`,'pl net','',6)}</div>`);
// B scale strip
function scaleStrip(){const W=480,x0=14,sw=W-28,Y1=52,Y2=114;const pos=D.filter(d=>d[1]>0),neg=D.filter(d=>d[1]<0);const k=sw/MAXV;let out='';
 // income bar (left to right)
 let x=x0;const pc=['#C9A24B','#E5C77A'];pos.forEach(([l,v],i)=>{const w=v*k;out+=`<rect x="${x}" y="${Y1}" width="${w-1.5}" height="16" fill="${pc[i%2]}"/><path d="M${x} ${Y1-3}v-5" stroke="#7F6A33"/><text x="${x+2}" y="${Y1-12}" font-family="Cinzel" font-size="9.5" letter-spacing="1.8" fill="#A89C80">${l.toUpperCase()}</text><text x="${x+2}" y="${Y1-26}" font-family="Alegreya" font-weight="700" font-size="17" fill="#69B3A2">+${v}</text>`;x+=w});
 // scale
 out+=`<path d="M${x0} ${Y1+24}H${x0+sw}" stroke="#4d4025"/>`+Array.from({length:41},(_,i)=>`<path d="M${x0+i*sw/40} ${Y1+24}v${i%10===0?8:i%5===0?6:3}" stroke="#7F6A33"/>`).join('');
 // costs hang from the right end of the income bar
 const costTot=neg.reduce((a,b)=>a+ab(b[1]),0);let cx=x0+(MAXV-costTot)*k;const nx=cx;const nc=['#D2603F','#e58a68'];
 neg.forEach(([l,v],i)=>{const w=ab(v)*k;out+=`<rect x="${cx}" y="${Y2}" width="${Math.max(w-1.5,2)}" height="16" fill="${nc[i%2]}"/><path d="M${cx+w/2} ${Y2+16}V${Y2+24+i*26}" stroke="#7F6A33"/><text x="${cx+w/2-5}" y="${Y2+36+i*26}" text-anchor="end" font-family="Alegreya" font-weight="700" font-size="17" fill="#ee8a68">−${ab(v)}<tspan font-family="Cinzel" font-weight="500" font-size="9.5" letter-spacing="1.8" fill="#A89C80" dx="8">${l.toUpperCase()}</tspan></text>`;cx+=w});
 out+=`<path d="M${nx} ${Y1+16}V${Y2}" stroke="#EFE6CF" stroke-dasharray="2 3"/><g transform="translate(${nx} ${Y1+34})"><path d="M0 0l-6 9h12z" fill="#EFE6CF" transform="translate(0 -9)"/></g><text x="${nx-10}" y="${Y1+62}" text-anchor="end" font-family="Cinzel" font-weight="700" font-size="11" letter-spacing="2.5" fill="#EFE6CF">NET <tspan font-family="Alegreya" font-size="19" fill="#69B3A2" dx="4" letter-spacing="0">+${NET}</tspan></text>`;
 return `<svg width="100%" viewBox="0 0 ${W} 196" style="padding:2px 14px 6px;box-sizing:border-box;display:block">${out}</svg>`}
const B=card('B','SCALE STRIP','Income stacks along a graduated scale in brass; costs hang below in rust. Segment length is the amount, so you see what drives the total at a glance. Net is the white pointer.',scaleStrip());
const C=card('C','LEDGER','Almanac style: a label, a dotted leader and the figure, with a hairline bar for share. Costs are rust, a zero is dim. A double rule closes the sum.',
 `<div class="C">${D.map(([l,v])=>`<div class="r ${v===0?'zero':''}"><div class="t"><span class="l">${l}</span><span class="d"></span><span class="v ${cls(v)}">${v===0?'0':sg(v)+ab(v)}</span></div><div class="b"><u style="width:${ab(v)/MAXV*100}%;background:${col(v)}"></u></div></div>`).join('')}<div class="sum"><span class="l">NET PER TURN</span><span class="d"></span><span class="v">+${NET}</span></div></div>`);
const Dm=card('D','MEDALS','Each source is a small bezel seal with its icon; the ring tints by sign. A rule threads them like medals on a ribbon and the net closes the line.',
 `<div class="D"><div class="rl"></div>${D.map(([l,v])=>`<div class="m ${v===0?'zero':''}"><svg width="52" height="52" viewBox="0 0 66 66">${bezelSvg(33,33,31,24)}<circle cx="33" cy="33" r="27" fill="none" stroke="${col(v)}" stroke-width="2.5" opacity=".9"/></svg><span style="position:absolute;left:0;right:0;top:0;height:52px;display:grid;place-items:center;color:${v===0?'#6f6650':'#E5C77A'}">${ico(IC[l==='Taxes'?'tax':'x']?'tax':'tax',1)}</span><div class="vv ${cls(v)}">${v===0?'0':sg(v)+ab(v)}</div><div class="ll">${l.toUpperCase()}</div></div>`).join('')}<div class="eq">=</div><div class="m"><svg width="52" height="52" viewBox="0 0 66 66">${bezelSvg(33,33,31,24)}<circle cx="33" cy="33" r="25" fill="url(#gBrass)"/></svg><div style="position:absolute;left:0;width:52px;margin-left:12px;top:0;height:52px;z-index:3;display:grid;place-items:center;color:#1b1408;font:700 15px Alegreya">+${NET}</div><div class="vv pos" style="margin-top:3px;visibility:hidden">.</div><div class="ll" style="color:var(--hi)">NET</div></div></div>`);
const drum=(v,big)=>{const s=String(ab(v)).padStart(3,' ');return `<div class="w"><div class="d s ${cls(v)}">${v===0?'·':sg(v)}</div>${s.split('').map(c=>`<div class="d ${cls(v)}">${c===' '?'':c}</div>`).join('')}</div>`};
const E=card('E','ODOMETER','Mechanical counters in brass frames: sign window, three digit drums. Positive digits glow verdigris, negative rust, zero goes dark. Net is a larger plate. It also rolls when the value changes.',
 `<div class="E">${D.map(([l,v])=>`<div class="u">${drum(v)}<div class="lb">${l.toUpperCase()}</div></div>`).join('')}<div class="u"><div class="w" style="padding:4px;background:linear-gradient(180deg,#f0d78f,#a8842f)"><div class="d s p" style="height:38px;line-height:38px">+</div>${String(NET).split('').map(c=>`<div class="d p" style="height:38px;line-height:38px;width:23px">${c}</div>`).join('')}</div><div class="lb" style="color:var(--hi)">NET</div></div></div>`);
const F=card('F','DIALS','Matches the top-bar gauges: a 270° arc filled by share of income, the figure inside, label beneath. Net uses the brass dial.',
 `<div class="F">${D.map(([l,v])=>`<div class="g ${v===0?'zero':''}">${gaugeSvg({r:22,v:v===0?'0':sg(v)+ab(v),d:'',f:Math.max(.01,ab(v)/MAXV),col:col(v)})}<div class="ll">${l.toUpperCase()}</div></div>`).join('')}<div class="g" style="width:88px">${gaugeSvg({r:28,v:'+'+NET,d:'',f:NET/MAXV,col:'#E5C77A'})}<div class="ll" style="color:var(--hi)">NET</div></div></div>`);
document.getElementById('g').innerHTML=A+B+C+Dm+E+F;
// medal icons: replace placeholder with proper icons
const medIc=['tax','trade','flag','army','invest'];document.querySelectorAll('.D .m:not(:last-child) > span').forEach((s,i)=>{if(medIc[i])s.innerHTML=ico(medIc[i],20)});
</script></body></html>
