name: Terra Bellum (Godot)
on:
  push:
    branches: [ "claude/**", main ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Import project
        run: cd godot && godot --headless --import || true
      - name: Engine unit tests (GDScript)
        run: cd godot && godot --headless -s tests/run_all.gd
      - name: Oracle: GDScript engine == JS reference (bit-exact)
        run: |
          npm ci
          tools/oracle.sh "$(which godot)"

  export:
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Import
        run: cd godot && godot --headless --import || true
      - name: Windows
        run: mkdir -p build/windows && cd godot && godot --headless --export-release "Windows Desktop" ../build/windows/TerraBellum.exe
      - name: Linux
        run: mkdir -p build/linux && cd godot && godot --headless --export-release "Linux" ../build/linux/TerraBellum.x86_64
      - name: Android (debug-signed APK)
        run: |
          mkdir -p build/android ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot --headless --path godot --quit || true
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cd godot && godot --headless --export-debug "Android" ../build/android/TerraBellum.apk
      - uses: actions/upload-artifact@v4
        with: { name: terra-bellum-builds, path: build/ }

  ios:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.4.1, use-dotnet: false, include-templates: true }
      - name: Export Xcode project (open it in Xcode to sign & publish)
        run: |
          mkdir -p build/ios
          cd godot && godot --headless --import || true
          godot --headless --export-release "iOS" ../build/ios/TerraBellum.ipa || true
      - uses: actions/upload-artifact@v4
        with: { name: terra-bellum-ios-xcode-project, path: build/ios/ }
